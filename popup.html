<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>QBO Autofill</title>
<style>
  body {
    width: 340px;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    padding: 12px;
    color: #222;
  }
  h1 {
    font-size: 14px;
    margin: 0 0 8px;
  }
  textarea {
    width: 100%;
    height: 110px;
    box-sizing: border-box;
    font-size: 11px;
    padding: 6px;
    resize: vertical;
  }
  .row {
    display: flex;
    gap: 6px;
    margin-top: 6px;
  }
  button {
    flex: 1;
    padding: 8px;
    font-size: 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  #parseBtn { background: #345B4E; color: white; }
  #fillBtn { background: #2CA01C; color: white; }
  #fillBtn:disabled { background: #b7d8b1; cursor: not-allowed; }

  .preview {
    margin-top: 10px;
    border-top: 1px solid #ddd;
    padding-top: 8px;
  }
  .field {
    margin-bottom: 6px;
  }
  .field label {
    display: block;
    font-size: 10px;
    color: #666;
    margin-bottom: 2px;
  }
  .field input {
    width: 100%;
    box-sizing: border-box;
    padding: 4px 6px;
    font-size: 12px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  #status {
    margin-top: 8px;
    font-size: 11px;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
  <h1>1. Paste the intake form text</h1>
  <textarea id="rawText" placeholder="Paste the full text from the intake PDF here..."></textarea>
  <div class="row">
    <button id="parseBtn">Parse</button>
  </div>

  <div class="preview">
    <h1>2. Review / edit</h1>
    <div class="field"><label>First name</label><input id="firstName" /></div>
    <div class="field"><label>Last name</label><input id="lastName" /></div>
    <div class="field"><label>Email</label><input id="email" /></div>
    <div class="field"><label>Phone number</label><input id="phone" /></div>
    <div class="field"><label>Address 1</label><input id="address1" /></div>
    <div class="field"><label>City</label><input id="city" /></div>
    <div class="field"><label>State</label><input id="state" /></div>
    <div class="field"><label>Zip</label><input id="zip" /></div>
  </div>

  <div class="row">
    <button id="fillBtn">3. Autofill QuickBooks tab</button>
  </div>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
